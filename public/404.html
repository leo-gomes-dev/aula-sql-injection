<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Não Encontrada - 404</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .error-container { text-align: center; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 350px; }
        h1 { color: #dc3545; margin: 0 0 10px 0; font-size: 48px; }
        p { color: #666; margin-bottom: 20px; }
        .back-link { display: inline-block; padding: 10px 20px; background-color: #007bff; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .back-link:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>404</h1>
        <h2>Ops! Página não encontrada</h2>
        <p>A rota que você tentou acessar não existe neste laboratório.</p>
        <a href="/" class="back-link">Voltar para o Login</a>
    </div>
</body>
</html>
